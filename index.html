<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataXLator™ - Universal Data Converter</title>
    
    <style>
        /* General Setup */
        body { 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
            background-color: #1E1E1E; /* Background (Main): Dark Charcoal */
            color: #D4D4D4; /* Text (Input/Output): Light Gray Text */
            min-height: 100vh;
        }
        h1 { margin-bottom: 5px; }
        .trademark { font-size: 0.5em; vertical-align: super; }
        .subtitle { margin-top: 0; color: #999; }

        /* Layout */
        .container { 
            display: flex; 
            width: 95%; 
            max-width: 1400px; 
            margin-top: 20px; 
            gap: 20px; 
            flex-grow: 1;
        }
        
        /* Text Areas (Code Input/Output) */
        textarea { 
            flex: 1; 
            min-height: 400px; 
            padding: 15px; 
            font-size: 14px; 
            font-family: 'Source Code Pro', monospace; 
            background-color: #2D2D2D; /* Lighter Charcoal for content boxes */
            color: #D4D4D4; /* Text (Input/Output) */
            border: 1px solid #3C3C3C; 
            border-radius: 8px; 
            resize: none; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: #007ACC; outline: none; }
        textarea.error { border-color: #D32F2F; /* Error: Deep Red */ }

        /* Controls Panel */
        .controls-panel {
            width: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 20px;
            background-color: #252525;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }

        /* Format Selectors */
        .format-selector-group {
            width: 100%;
            text-align: left;
            margin-bottom: 10px;
        }
        .format-selector-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #999;
            font-size: 0.9em;
        }
        .format-selector-group select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            background-color: #3C3C3C;
            color: #D4D4D4;
            border: 1px solid #555;
            font-size: 1em;
        }
        
        /* Buttons */
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
        }
        button:hover { transform: translateY(-1px); }
        button:disabled { 
            background-color: #555; 
            cursor: not-allowed; 
        }

        /* Primary Action Button (Convert) */
        #execute-convert {
            background-color: #007ACC; /* Accent/Action: Vibrant Blue */
            color: white;
            margin-top: 10px;
        }
        #execute-convert:hover { background-color: #005A9C; } /* Slightly darker blue on hover */

        /* Swap Button (Secondary Action) */
        #swap-button {
            background-color: #555;
            color: white;
            margin-bottom: 20px;
        }
        #swap-button:hover { background-color: #444; }

        /* Pricing/Pro Section */
        .pricing-section {
            width: 100%;
            text-align: center;
            border-top: 1px solid #3C3C3C;
            padding-top: 15px;
            margin-top: 20px;
        }
        .pricing-section p {
            margin: 0;
            font-weight: bold;
            color: #4CAF50; /* Success/Copy: Green for emphasis */
            font-size: 1.1em;
        }
        .pricing-section button {
            margin-top: 10px;
            background-color: #D32F2F; /* Deep Red for urgent CTA */
            color: white;
            padding: 12px 15px;
            font-size: 1em;
        }
        .pricing-section button:hover { background-color: #B71C1C; }
        .urgent-text {
            color: #FFC107 !important; /* Amber/Yellow for limited time */
            font-size: 0.9em !important;
        }
        
        /* Bulk Converter Section */
        .bulk-converter {
            width: 100%;
            border-top: 1px solid #3C3C3C;
            padding-top: 15px;
            margin-top: 20px;
            text-align: center;
        }
        #bulk-message {
            min-height: 20px;
            color: #D32F2F; /* Error: Deep Red for error messages */
            font-size: 0.9em;
            margin-top: 5px;
        }
        #bulk-convert-button {
            background-color: #007ACC; /* Accent/Action: Vibrant Blue */
            color: white;
            margin-top: 10px;
        }
        #bulk-convert-button:hover { background-color: #005A9C; }
        
        /* Teams Button */
        #teams-button {
            background-color: #4CAF50; /* Green for B2B/Enterprise CTA */
            color: white;
            margin-top: 20px;
        }
        #teams-button:hover { background-color: #388E3C; }

        /* Footer */
        footer { 
            margin-top: 40px; 
            width: 100%; 
            max-width: 1400px;
            text-align: center;
        }
        footer a {
            color: #007ACC; /* Accent/Action: Vibrant Blue for links */ 
            text-decoration: none;
        }
    </style>
</head>
<body>

    <h1>DataXLator<span class="trademark">™</span></h1>
    <p class="subtitle">The universal single-file and bulk data converter.</p>

    <div class="container">
        <textarea id="input-data" placeholder="Paste data here..." title="Input Data Area"></textarea>

        <div class="controls-panel">
            
            <div class="format-selector-group">
                <label for="input-format">Input Format:</label>
                <select id="input-format">
                    <option value="json">JSON</option>
                    <option value="yaml">YAML</option>
                    <option value="csv">CSV (PRO)</option>
                </select>
            </div>

            <div class="format-selector-group">
                <label for="output-format">Output Format:</label>
                <select id="output-format">
                    <option value="yaml">YAML</option>
                    <option value="json">JSON</option>
                    <option value="sql">SQL INSERT (PRO)</option>
                </select>
            </div>
            
            <button id="swap-button" title="Swap Input and Output Formats">
                Swap Formats
            </button>

            <button id="execute-convert" title="Execute Single File Conversion">
                Convert Data
            </button>
            
            <a href="teams.html" style="width: 100%; text-decoration: none;">
                <button id="teams-button" title="Upgrade to our B2B Teams plan">
                    For Teams & Enterprise
                </button>
            </a>

            <div class="bulk-converter">
                <p style="margin-bottom: 5px; font-weight: bold; color: #4CAF50;">PRO: Bulk ZIP Conversion</p>
                <input type="file" id="bulk-file-input" accept=".zip" title="Select a ZIP file to upload">
                <button id="bulk-convert-button" title="Upload and convert multiple files">
                    Bulk Convert Files
                </button>
                <div id="bulk-message"></div>
            </div>

            <div class="pricing-section">
                <p>Unlock Pro Features:</p>
                <button id="monthly-pro-button"
                        onclick="trackEvent('CTA_Click_Upgrade_Button', { type: 'monthly' }); window.open('https://buy.stripe.com/bJefZ95ax6nn5XBfUa0Ny00', '_blank')"
                        title="Start a recurring monthly subscription">
                    Pro Monthly: $7/mo
                </button>
                
                <p style="margin: 15px 0 5px 0;">OR</p>

                <button id="lifetime-pro-button"
                        onclick="trackEvent('CTA_Click_Upgrade_Button', { type: 'lifetime' }); window.open('https://buy.stripe.com/fZu9AL32p8vv0DhfUa0Ny01', '_blank')"
                        title="Get access forever with a single payment">
                    Lifetime Access: $29
                </button>
                <p class="urgent-text">Limited Time Introductory Offer!</p>
            </div>
        </div>

        <textarea id="output-data" placeholder="Translated data will appear here..." readonly title="Output Data Area"></textarea>
    </div>

    <footer>
        <p style="font-size: 0.8em; margin-top: 40px; color: #555;">
            Copyright &copy; 2025 DataXLator<span class="trademark">™</span>. <a href="LICENSE.md" style="color: #007ACC; text-decoration: none;">All rights reserved.</a>
        </p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
